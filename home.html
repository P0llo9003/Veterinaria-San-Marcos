<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title> Home </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="carrito.css">
    <script src="funciones.js" defer></script>
    <script src="carrito.js" defer></script>

</head>
<body>
    <header>
        <div class="cabecera encabezado">
            <nav aria-label="navegacion">
                <ul>
                <li><a href="home.html">Inicio</a></li>
                </ul>
            </nav>

            <button class="btnAgendar" onclick="agendar()">

                Agendar Hora

            </button>

            <button class="btnCarrito" onclick="abrirCarrito()">
                Carrito (<span id="cantidadCarrito">0</span>)
            </button>
            
        </div>    
    </header>
    <div class="contenedor cuerpo color">
    <h1>Veterinaria San Marcos</h1>
    <h3>"Cuidamos a quienes amas"</h3>
    </div>

    <div id="fondoCarrito" class="fondoCarrito" onclick="cerrarCarrito()"></div>

    <aside id="carritoLateral" class="carritoLateral">
        <div class="tituloCarrito">
            <h2>Resumen</h2>
            <button onclick="cerrarCarrito()">X</button>
        </div>

        <div id="listaCarrito" class="listaCarrito"></div>

        <div class="resumenCarrito">
            <div class="filaCarrito">
                <div>
                    <strong>Pago con transferencias</strong>
                    <small>Transferencia y Banco Estado</small>
                </div>
                <strong id="totalTransferencia">$0</strong>
            </div>

            <div class="filaCarrito">
                <div>
                    <span>Otros medios de pago</span>
                    <small>Webpay/Onepay</small>
                </div>
                <span id="totalOtros">$0</span>
            </div>

            <div class="filaCarrito">
                <strong>Envío</strong>
                <span>-</span>
            </div>

            <div class="filaCarrito totalCarrito">
                <strong>TOTAL</strong>
                <strong id="totalCarrito">$0</strong>
            </div>
        </div>

        <div class="botonesCarrito">
            <button onclick="iniciarPago()">Iniciar pago</button>
            <a href="carrito.html">Ir al carro</a>
        </div>
    </aside>

</body>




</html>
