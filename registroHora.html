<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>registroHora</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/funciones.js" defer></script>
</head>
<body>
    <header>
        <div class="cabecera encabezado">
            <nav aria-label="navegacion">
                <ul>
                    <li><a href="home.html">Inicio</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section>
        <form id="form-agendar" class="formulario color" novalidate>
            <h1>Reserva de Hora</h1>
            <h3>Ingrese sus datos:</h3>
            <table>
                <tr>
                    <td><input type="text" id="nombre-duenio" placeholder="Nombre" required></td>
                    <td><input type="text" id="apellido-duenio" placeholder="Apellidos" required></td>
                </tr>
                <tr>
                    <td><input type="email" id="correo-duenio" placeholder="correo@ejemplo.com" required></td>
                    <td><input type="text" id="telefono-duenio" placeholder="Número de contacto" required></td>
                </tr>
                <tr>
                    <td><input type="text" id="nombre-mascota" placeholder="Nombre de Mascota" required></td>
                    <td><input type="number" id="edad-mascota" min="1" max="100" placeholder="Edad Mascota"></td>
                </tr>
                <tr>
                    <td><input type="date" id="fecha-hora" required></td>
                    <td><input type="time" id="hora-hora" required></td>
                </tr>
            </table>

            <button type="submit">Agendar Hora</button>
        </form>
    </section>
</body>
</html>
