<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/login.js" defer></script>
</head>
<body>
    <header>
        <div class="cabecera encabezado">
            <nav aria-label="navegacion">
                <ul>
                    <li><a href="home.html">Inicio</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section>
        <form id="form-registro" class="formulario color" novalidate>
            <h1>Crear Cuenta</h1>
            <table>
                <tr>
                    <td><input type="text" id="nuevo-usuario" placeholder="Usuario" required></td>
                </tr>
                <tr>
                    <td><input type="password" id="nueva-password" placeholder="Contraseña" required></td>
                </tr>
                <tr>
                    <td><input type="password" id="confirmar-password" placeholder="Confirmar contraseña" required></td>
                </tr>
            </table>

            <button type="submit">Crear Cuenta</button>

            <p class="linkRegistro">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </form>
    </section>
</body>
</html>
